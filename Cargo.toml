[package]
name = "federated-ai-platform"
version = "0.1.0"
edition = "2021"
description = "Federated AI Platform: Privacy-preserving FL + RAG + CoT + Agent"
authors = ["dechang64"]

[dependencies]
# Web & API
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
warp = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Vector DB - HNSW (自研，不依赖faiss)
hnsw = "0.5"
rand = "0.8"

# Crypto & Audit
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# gRPC proto
prost-build = "0.13"

# Async
futures = "0.3"
async-trait = "0.1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[build-dependencies]
prost-build = "0.13"

[[bin]]
name = "federated-ai-platform"
path = "src/main.rs"
